<!DOCTYPE html>
<html>
<head>
    <style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #eaf1ff, #f7fbff);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Main Box */
.box {
  background: #ffffff;
  width: 360px;
  padding: 30px 25px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
  text-align: center;
}

/* Heading */
.box h2 {
  margin-bottom: 20px;
  color: #1e3a8a;
  font-size: 22px;
}

/* Inputs */
.box input {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 14px;
  border: 1px solid #cfd8dc;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}

.box input:focus {
  border-color: #2563eb;
}

/* Button */
.box button {
  width: 100%;
  padding: 12px;
  background: #f59e0b;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  color: #000;
  cursor: pointer;
  transition: 0.3s ease;
}

.box button:hover {
  background: #d97706;
}

/* Message */
#msg {
  margin-top: 12px;
  font-size: 14px;
  color: red;
}
</style>
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">
  <h2>Admin Login</h2>

  <input type="text" id="username" placeholder="Admin ID">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <p id="msg"></p>
</div>

<script src="login.js"></script>
</body>
</html>
