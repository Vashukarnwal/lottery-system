<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Result</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f6ff;
      font-family: Arial, sans-serif;
    }
    .box {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
      text-align: center;
      width: 300px;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: orange;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    p {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Live Result</h2>

  <!-- ✅ SINGLE INPUT (extra input hata diya) -->
  <input type="text" id="number" placeholder="Enter your number">

  <button onclick="checkResult()">Check Result</button>

  <p id="result"></p>
</div>

<!-- ❌ result.js hata diya, yahin JS rakha (tumhari style me) -->
<script>
function checkResult() {
  const userNumber = document.getElementById("number").value.trim();
  const resultBox = document.getElementById("result");

  if (!userNumber) {
    resultBox.innerText = "Enter number";
    return;
  }

  fetch("/api/check", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ number: userNumber })
  })
    .then(res => res.json())
    .then(data => {
      if (data.winner) {
        window.location.href = "/won.html";
      } else {
        resultBox.innerText = "❌ Not a Winner";
      }
    })
    .catch(() => {
      resultBox.innerText = "Server error";
    });
}
</script>

</body>
</html>
