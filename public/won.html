<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lottery Winner</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f1f1;
  }

  .page {
    max-width: 420px;
    margin: auto;
    background: #fff;
  }

  /* ===== WINNER IMAGE SECTION ===== */
  .winner-section {
    position: relative;
  }

  .winner-section img {
    width: 100%;
    display: block;
  }

  .winner-text {
    position: absolute;
    bottom: 120px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    gap: 6px;
  }

  .winner-text h1 {
    margin: 0;
    font-size: 26px;
  }

  .winner-rank {
    font-size: 14px;
    font-weight: bold;
    color: #ffeb3b;
  }

  .winner-text .number {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
  }

  /* ===== CERTIFICATE SECTION ===== */
  .certificate-section {
    position: relative;
  }

  .certificate-section img {
    width: 100%;
    display: block;
  }

  .cert-name {
    position: absolute;
    top: 430px;
    left: 50%;
    transform: translateX(-50%);
    font-weight: bold;
    font-size: 18px;
    white-space: nowrap;
  }

  .cert-number {
    position: absolute;
    top: 331px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    white-space: nowrap;
  }

  .cert-extra {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    white-space: nowrap;
  }

  .ticket   { top: 360px; }
  .series   { top: 385px; }
  .amount   { top: 410px; font-weight: bold; }
  .date     { top: 455px; }
</style>
</head>

<body>

<div class="page">

  <!-- ===== WINNER IMAGE ===== -->
  <div class="winner-section">
    <img src="img/winner.png" alt="Winner">

    <div class="winner-text">
      <h1>🎉 YOU WON 🎉</h1>
      <div class="winner-rank" id="winnerRank"></div>
      <div class="number" id="winnerNumber"></div>
    </div>
  </div>

  <!-- ===== CERTIFICATE IMAGE ===== -->
  <div class="certificate-section">
    <img src="img/certificate.png" alt="Certificate">

    <!-- MAIN DETAILS -->
    <div class="cert-name" id="certName"></div>
    <div class="cert-number" id="certNumber"></div>

    <!-- EXTRA DETAILS -->
    <div class="cert-extra ticket" id="ticketNumber"></div>
    <div class="cert-extra series" id="seriesCode"></div>
    <div class="cert-extra amount" id="prizeAmount"></div>
    <div class="cert-extra date" id="drawDate"></div>
  </div>

</div>

<!-- ===== AUTO-FILL SCRIPT ===== -->
<script>
fetch("/api/winner?ts=" + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById("winnerRank").innerText = d.rank;
    document.getElementById("winnerNumber").innerText = d.number;
    document.getElementById("certName").innerText = d.name;
    document.getElementById("certNumber").innerText = "Winning No : " + d.number;
    document.getElementById("ticketNumber").innerText = "Ticket : " + d.ticket;
    document.getElementById("seriesCode").innerText = "Series : " + d.series;
    document.getElementById("prizeAmount").innerText = "Prize : " + d.amount;
    document.getElementById("drawDate").innerText = "Draw Date : " + d.date;
  });
</script>



</body>
</html>
