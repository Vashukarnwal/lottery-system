<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lottery Winner</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f1f1;
  }

  .page {
    max-width: 420px;
    margin: auto;
    background: #fff;
  }

  /* ===== WINNER IMAGE SECTION ===== */
  .winner-section {
    position: relative;
  }

  .winner-section img {
    width: 100%;
    display: block;
  }

  .winner-text {
  position: absolute;
  bottom: 120px;              /* 👈 thoda upar */
  width: 100%;
  display: flex;              /* ⭐ */
  flex-direction: column;     /* ⭐ */
  align-items: center;        /* ⭐ perfect center */
  justify-content: center;
  text-align: center;
  color: white;
  gap: 6px;                   /* ⭐ spacing control */
}


  .winner-text h1 {
    margin: 0;
    font-size: 26px;
  }

  .winner-text .number {
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 2px;
}


  .live {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: red;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
}


  /* ===== CERTIFICATE SECTION ===== */
  .certificate-section {
    position: relative;
  }

  .certificate-section img {
    width: 100%;
    display: block;
  }

  .cert-name {
    position: absolute;
    top: 220px;
    left: 50%;
    transform: translateX(-50%);
    font-weight: bold;
    font-size: 18px;
  }

  .cert-number {
    position: absolute;
    top: 290px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
  }
</style>
</head>

<body>

<div class="page">

  <!-- ===== WINNER IMAGE ===== -->
  <div class="winner-section">
    <img src="img/winner.png" alt="Winner">

    <div class="winner-text">
      <h1>🎉 YOU WON 🎉</h1>
      <!-- 🔝 WINNING NUMBER -->
      <div class="number" id="winnerNumber"></div>
      <div class="live">● LIVE</div>
    </div>
  </div>

  <!-- ===== CERTIFICATE IMAGE ===== -->
  <div class="certificate-section">
    <img src="img/certificate.png" alt="Certificate">

    <!-- 🔽 CERTIFICATE DETAILS -->
    <div class="cert-name" id="certName"></div>
    <div class="cert-number" id="certNumber"></div>
  </div>

</div>

<!-- ===== ONLY TEXT FILL SCRIPT ===== -->
<script>
fetch("/api/winner")
  .then(res => res.json())
  .then(data => {
    if (!data) return;

    // 🔝 top winner number
    document.getElementById("winnerNumber").innerText = data.number || "";

    // 🔽 certificate name + number
    document.getElementById("certName").innerText = data.name || "";
    document.getElementById("certNumber").innerText =
      data.number ? "Winning Number : " + data.number : "";
  })
  .catch(err => console.log(err));
</script>

</body>
</html>
